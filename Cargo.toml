[package]
name = "spruceos-installer"
version = "1.6.0"
edition = "2021"
description = "SpruceOS SD Card Installer"
authors = ["SpruceOS Team (https://github.com/spruceUI)", "CMTag (https://github.com/CMTag)",  "NextUI Team (https://github.com/LoveRetro)", "Helaas (https://github.com/Helaas)"]
license = "CC-BY-NC-4.0"

[features]
default = []
icon = []

[dependencies]
eframe = "0.33"
egui = "0.33"
egui_extras = { version = "0.33", features = ["all_loaders"] }
egui-thematic = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "fs", "process", "sync", "time", "io-util", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
# Streams a .7z entry as it decompresses, which the bundled 7-Zip binary cannot
# do -- that is what keeps an 8 GB raw image from needing 8 GB of scratch space
# on the way to the card. Decoders (LZMA/LZMA2/BCJ/DELTA) are always built; the
# default "compress" feature only adds an encoder we never call.
sevenz-rust = { version = "0.6", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
tokio-util = "0.7"
dirs = "5"
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["png", "qoi"] }
lazy_static = "1.4"
libc = "0.2"
sha2 = "0.10"
flate2 = "1.0"
zip = { version = "2", default-features = false, features = ["deflate"] }
arboard = "3.4"
regex = "1"
which = "6.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Registry",
    "Win32_Security",
] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "2"

[profile.release]
opt-level = "z"
lto = true
strip = "debuginfo"



